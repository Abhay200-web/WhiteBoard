[package]
name = "whiteboard-desktop"
version = "0.1.0"
description = "Whiteboard desktop shell: Host/Client mode, Host server sidecar, tray"
edition = "2021"
publish = false

[[bin]]
name = "whiteboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
win32job = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
