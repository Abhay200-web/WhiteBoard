name: Release

# Push a tag like v0.1.0 to build the Windows installer and publish it as a GitHub release.
# The tag must match the desktop version (apps/desktop/src-tauri/tauri.conf.json).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the desktop version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the desktop version v$version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from package.json)
        run: corepack enable pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Builds the web app, the server sidecar (pinned Node + server) and the .msi (beforeBuildCommand).
      - name: Build the installer
        run: pnpm --filter @whiteboard/desktop installer

      - name: Publish the release with the installer and its checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msi=$(ls apps/desktop/src-tauri/target/release/bundle/msi/*.msi)
          sha256sum "$msi" | sed 's# .*/# #' > checksum.txt
          cat checksum.txt
          gh release create "$GITHUB_REF_NAME" --title "Whiteboard $GITHUB_REF_NAME" \
            --generate-notes "$msi" checksum.txt
